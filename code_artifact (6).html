<style>
:root{
  --bg:#EDF1EA; --surface:#FFFFFF; --surface-2:#F5F7F1;
  --ink:#25322B; --ink-soft:#5B6B60;
  --primary:#1F6F5C; --primary-dark:#164E41;
  --gold:#C9A227; --silver:#8B96A0; --bronze:#B08968;
  --line:#D8DED2; --danger:#B23A22;
  --shadow: 0 2px 0 rgba(37,50,43,0.08);
  padding-top: env(safe-area-inset-top,0px);
  padding-bottom: env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1B2420; --surface:#232F29; --surface-2:#1F2A25;
    --ink:#EAF0EA; --ink-soft:#A9B8AE; --line:#37453D;
  }
}
:root[data-theme="dark"]{
  --bg:#1B2420; --surface:#232F29; --surface-2:#1F2A25;
  --ink:#EAF0EA; --ink-soft:#A9B8AE; --line:#37453D;
}
html{scroll-padding-top:env(safe-area-inset-top,0px); box-sizing:border-box;}
*,*::before,*::after{box-sizing:inherit;}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Noto Sans JP",sans-serif; min-height:100%;
}
h1,h2,h3,.brand{font-family:"Zen Maru Gothic",sans-serif;}
header{
  position:sticky; top:0; z-index:20; background:var(--primary); color:#fff;
  padding-top:env(safe-area-inset-top,0px);
}
.headwrap{max-width:920px;margin:0 auto;padding:12px 16px 8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.brand{font-weight:900;font-size:1.2rem;letter-spacing:.02em;}
.brand small{display:block;font-family:"Noto Sans JP";font-weight:400;font-size:.66rem;color:#CFE6DC;}
nav{max-width:920px;margin:0 auto;display:flex;gap:2px;padding:0 10px;overflow-x:auto;}
nav button{
  flex:1;min-width:84px;background:transparent;border:none;color:#CFE6DC;
  padding:10px 6px 12px;font-family:"Noto Sans JP";font-size:.8rem;font-weight:500;
  border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;
}
nav button.active{color:#fff;border-bottom-color:var(--gold);font-weight:700;}
nav button.secondary{color:#B9D6C8;font-size:.74rem;margin-left:auto;flex:none;min-width:auto;padding:10px 10px 12px;}
nav button.secondary.active{color:#fff;}
.subnav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
.subnav button{
  background:var(--surface);color:var(--ink-soft);border:1px solid var(--line);
  border-radius:20px;padding:7px 14px;font-size:.8rem;font-weight:700;cursor:pointer;
}
.subnav button.active{background:var(--primary);color:#fff;border-color:var(--primary);}
.rec-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:9px 4px;border-bottom:1px solid var(--line);justify-content:space-between;}
.rec-row:last-child{border-bottom:none;}
.setup-hint{font-size:.72rem;color:var(--ink-soft);margin:2px 0 0;line-height:1.4;}
.assign-table{border-collapse:collapse;width:100%;font-size:.78rem;}
.assign-table th,.assign-table td{padding:7px 8px;border-top:1px solid var(--line);text-align:center;white-space:nowrap;}
.assign-table th{color:var(--ink-soft);font-weight:700;background:var(--surface-2);}
.assign-table td:first-child,.assign-table th:first-child{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1;}
.assign-table th:first-child{background:var(--surface-2);}
.btn.gold{background:var(--gold);color:#3a2c00;}
.btn.gold:hover{filter:brightness(0.95);}
#student-app{display:none;max-width:640px;margin:0 auto;padding:20px 16px 60px;padding-top:calc(20px + env(safe-area-inset-top,0px));}
html.student-mode header,html.student-mode main{display:none!important;}
html.student-mode #student-app{display:block;}
.student-pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:10px;margin-top:10px;}
.student-pick-grid button{padding:14px 8px;font-size:.95rem;font-weight:700;}
main{max-width:920px;margin:0 auto;padding:18px 16px 60px;}
.panel{display:none;} .panel.active{display:block;}
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow);
}
.card h2{margin:0 0 4px;font-size:1.05rem;}
.card .sub{color:var(--ink-soft);font-size:.82rem;margin:0 0 12px;line-height:1.45;}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
label{font-size:.76rem;color:var(--ink-soft);display:block;margin-bottom:3px;}
input,select,textarea{
  font-family:inherit;font-size:.9rem;padding:7px 10px;border:1px solid var(--line);
  border-radius:7px;background:var(--surface-2);color:var(--ink);
}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--primary);outline-offset:1px;}
.btn{
  background:var(--primary);color:#fff;border:none;border-radius:7px;padding:8px 15px;
  font-size:.86rem;font-weight:700;cursor:pointer;font-family:"Noto Sans JP";display:inline-flex;align-items:center;justify-content:center;gap:4px;
}
.btn:hover{background:var(--primary-dark);}
.btn.ghost{background:transparent;color:var(--primary);border:1px solid var(--primary);}
.btn.ghost:hover{background:rgba(31,111,92,0.08);}
.btn.small{padding:5px 10px;font-size:.76rem;}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger);}
.btn.danger:hover{background:rgba(178,58,34,0.08);}
.medal{
  display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;
  border-radius:50%;font-size:.68rem;font-weight:900;color:#fff;flex:none;
}
.medal.初級{background:var(--bronze);} .medal.中級{background:var(--silver);color:#2b2b2b;}
.medal.上級{background:var(--gold);color:#3a2c00;} .medal.none{background:var(--line);color:var(--ink-soft);}
.student-row{display:flex;align-items:center;gap:8px;padding:8px 4px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
.student-row:last-child{border-bottom:none;}
.sname{font-weight:700;flex:1;min-width:110px;}
.pts{font-size:.82rem;color:var(--primary);font-weight:700;white-space:nowrap;}
.detail{background:var(--surface-2);border-radius:8px;padding:12px;margin:6px 0 14px;border:1px solid var(--line);}
.taskrank-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;margin-top:6px;}
.taskrank-cell{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);}
.taskrank-cell .tname{font-size:.82rem;font-weight:700;margin-bottom:4px;}
.progress{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:4px;}
.progress i{display:block;height:100%;background:var(--primary);}
.quest-bar{
  background:linear-gradient(135deg, var(--primary-dark), var(--primary));
  color:#fff; border-radius:10px; padding:12px 16px; margin-bottom:14px;
  box-shadow:var(--shadow);
}
.quest-bar .q-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;}
.quest-bar .q-title{font-family:"Zen Maru Gothic";font-weight:900;font-size:.98rem;}
.quest-bar .q-pts{font-size:.82rem;color:#CFE6DC;font-weight:700;}
.quest-track{height:12px;background:rgba(0,0,0,0.28);border-radius:6px;overflow:hidden;margin-top:7px;}
.quest-fill{height:100%;background:linear-gradient(90deg, var(--gold), #FFE066);transition:width .4s ease;}
.badge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:8px;margin-top:6px;}
.badge-item{
  border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:var(--surface);
  display:flex;align-items:center;gap:8px;font-size:.75rem;
}
.badge-item.locked{opacity:0.42;filter:grayscale(1);background:var(--surface-2);}
.badge-item .b-icon{font-size:1.25rem;flex:none;}
.badge-item .b-title{font-weight:700;color:var(--ink);display:block;font-size:.76rem;}
.badge-item .b-desc{font-size:.66rem;color:var(--ink-soft);display:block;line-height:1.25;}
.mvp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;}
.tasktype-card{border:1px dashed var(--line);border-radius:8px;padding:12px;margin-bottom:10px;}
.rankline{display:grid;grid-template-columns:28px 90px 1fr;gap:8px;align-items:center;margin:6px 0;}
.rankline input{width:100%;}
.hist-item{font-size:.8rem;padding:6px 0;border-bottom:1px dashed var(--line);color:var(--ink-soft);}
.hist-item b{color:var(--ink);}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;}
.stat{background:var(--surface-2);border-radius:8px;padding:12px;text-align:center;}
.stat .n{font-size:1.45rem;font-weight:900;color:var(--primary);font-family:"Zen Maru Gothic";}
.stat .l{font-size:.72rem;color:var(--ink-soft);}
.empty{color:var(--ink-soft);font-size:.84rem;padding:10px 0;}
.chip{display:inline-block;font-size:.7rem;padding:2px 8px;border-radius:10px;background:var(--surface-2);color:var(--ink-soft);margin-left:4px;}
.chip.ok{background:#DCEFE6;color:var(--primary-dark);font-weight:700;}
.toast{
  position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--primary-dark);
  color:#fff;padding:10px 18px;border-radius:20px;font-size:.84rem;box-shadow:0 4px 14px rgba(0,0,0,.25);
  z-index:50;opacity:0;transition:opacity .25s; pointer-events:none; display:flex; align-items:center; gap:8px; white-space:nowrap; max-width:94vw; overflow:hidden; text-overflow:ellipsis;
}
.toast.show{opacity:1;}
fieldset{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:0 0 10px;}
legend{font-size:.75rem;color:var(--ink-soft);padding:0 4px;font-weight:700;}
.check-row{display:flex;align-items:center;gap:6px;font-size:.82rem;cursor:pointer;}
.confetti-piece{
  position:fixed;top:-12px;width:9px;height:14px;border-radius:2px;z-index:999;pointer-events:none;
  animation:confettiFall 1.8s ease-out forwards;
}
@keyframes confettiFall{
  0%{transform:translateY(0) rotate(0deg);opacity:1;}
  100%{transform:translateY(100vh) rotate(540deg);opacity:0;}
}
::-webkit-scrollbar{height:6px;width:6px;} ::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px;}
</style>

  const m = String(d.getMonth() + 1).padStart(2, "0");

function buildPristineTemplate(){
  const raw = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
  try{
    const doc = new DOMParser().parseFromString(raw, "text/html");
    doc.querySelectorAll("script").forEach(s=>{
      const isAppData = s.id === "app-data";
      const isMainScript = s.textContent.indexOf("SOJI-APP-MAIN-SCRIPT-V1") !== -1;
      if(!isAppData && !isMainScript) s.remove();
    });
    return "<!DOCTYPE html>\n" + doc.documentElement.outerHTML;
  }catch(e){
    return raw;
  }
}
const PRISTINE_HTML = buildPristineTemplate();

function loadEmbeddedData(){

function migrateData(d){
  if(!d || typeof d !== "object") d = defaultData();
  if(!d.rewardUnit) d.rewardUnit = "がんばりポイント";
  if(!d.evalMultipliers) d.evalMultipliers = {great:1.2, good:1.0, needsWork:0.6};
  if(!d.teacherPin) d.teacherPin = "0000";
  if(!d.guildQuest) d.guildQuest = {title:"みんなで目指そう！", target:500, reward:"クラスお楽しみ会"};
  if(!d.mvpDays || d.mvpDays < 1) d.mvpDays = 7;
  if(typeof d.autoMasterBadges !== "boolean") d.autoMasterBadges = true;
  if(!d.features || typeof d.features !== "object"){
    d.features = {quest:true, badges:true, mvp:true, ranking:true};
  } else {
    if(typeof d.features.quest !== "boolean") d.features.quest = true;
    if(typeof d.features.badges !== "boolean") d.features.badges = true;
    if(typeof d.features.mvp !== "boolean") d.features.mvp = true;
    if(typeof d.features.ranking !== "boolean") d.features.ranking = true;
  }
  if(!Array.isArray(d.badgeDefs) || !d.badgeDefs.length) d.badgeDefs = defaultBadgeDefs();
  if(!Array.isArray(d.taskTypes)) d.taskTypes = defaultData().taskTypes;
  if(!Array.isArray(d.students)) d.students = [];
  if(!Array.isArray(d.records)) d.records = [];
  d.students.forEach(s=>{
    if(!s.party) s.party = "未所属";
    if(!s.taskState) s.taskState = {};
    if(!s.assigned) s.assigned = {};
    if(typeof s.totalReward !== "number") s.totalReward = 0;
  });
  return d;
}

let artifactCap = null;
let publishing = false, publishQueued = false;

async function initArtifactSync(){
  setSyncStatus("☁️ 接続中…");
  try{
    if(!(window.claude && window.claude.use)){ setSyncStatus("💾 この端末に自動保存"); return; }
    artifactCap = await window.claude.use("artifact");

  }catch(e){
    setSyncStatus("💾 この端末に自動保存");

function buildPublishHtml(){
  const json = JSON.stringify(data).replace(/<\/script/gi, "<\\/script");
  return PRISTINE_HTML.replace(
    /<script id="app-data"[^>]*>[\s\S]*?<\/script>/,
    `<script id="app-data" type="application/json">${json}<\/script>`
  );
}

let publishFailCount = 0;
async function flushPublish(){
  if(!artifactCap) return;
  if(publishing){ publishQueued = true; return; }
  publishing = true;
  try{
    await artifactCap.publish(buildPublishHtml());
    publishFailCount = 0;
  }catch(e){
    const code = e && e.code;
    if(code === "not_writer" || code === "not_granted" || code === "not_declared"){
      artifactCap = null;
      setSyncStatus("💾 この端末のみ(共有書込権限なし)");
    } else if(code === "too_large"){
      toast("保存データが大きすぎます。古い記録を整理してください");
    } else if(code !== "conflict"){
      publishFailCount++;
      if(publishFailCount <= 3) publishQueued = true;
    }
  }
  publishing = false;
  if(publishQueued){ publishQueued = false; flushPublish(); }
}

let publishDebounceTimer = null;
let publishDebouncePending = false;
const UNDO_LIMIT = 15;
let undoStack = [];

function pushUndo(label){
  try{
    const snap = JSON.stringify(data);
    undoStack.push({label: label || "直前の操作", snapshot: snap});
    if(undoStack.length > UNDO_LIMIT) undoStack.shift();
    updateUndoButton();
  }catch(e){}
}
function updateUndoButton(){
  const btn = document.getElementById("undo-btn");
  if(!btn) return;
  if(undoStack.length > 0 && viewMode === "teacher"){
    const last = undoStack[undoStack.length - 1];
    btn.style.display = "inline-flex";
    btn.textContent = `↩️ 戻す(${last.label})`;
  } else {
    btn.style.display = "none";
  }
}
function performUndo(){
  if(!undoStack.length){ toast("これ以上戻せる操作はありません"); return; }
  const last = undoStack.pop();
  try{
    data = migrateData(JSON.parse(last.snapshot));
    save(true);
    updateUndoButton();
    render();
    toast(`「${last.label}」を取り消して元に戻しました`, false);
  }catch(e){
    toast("元に戻す処理に失敗しました");
  }
}

function save(skipUndoUI){
  pruneRecordsIfNeeded();
  saveLocal();
  if(!skipUndoUI) updateUndoButton();
  clearTimeout(publishDebounceTimer);
  publishDebouncePending = true;
  publishDebounceTimer = setTimeout(()=>{ publishDebouncePending = false; flushPublish(); }, 1500);
}
window.addEventListener("beforeunload", ()=>{
  if(publishDebouncePending){
    clearTimeout(publishDebounceTimer);
    publishDebouncePending = false;
    flushPublish();
  }
});

function escapeHtml(str){
  return String(str == null ? "" : str).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

  const t = document.getElementById("toast");

  t.classList.add("show");

}

    if(!parts.length) return null;
    return {name: parts[0], party: parts[1] || "未所属"};
  }).filter(Boolean);

function studentTaskState(student, taskId){
  return (student.taskState && student.taskState[taskId]) || {rank:"初級", count:0, evalSum:0, evalCount:0, silentCount:0};
}
function ensureTaskState(student, taskId){
  if(!student.taskState) student.taskState = {};
  if(!student.taskState[taskId]) student.taskState[taskId] = {rank:"初級", count:0, evalSum:0, evalCount:0, silentCount:0};
  return student.taskState[taskId];
}
function avgEval(st){ return st.evalCount ? (st.evalSum/st.evalCount) : 0; }
function nextRank(r){ const i=RANKS.indexOf(r); return i<RANKS.length-1 ? RANKS[i+1] : null; }

function getBadgesForStudent(s){
  let stateCount = 0, stateSilent = 0, stateEvalSum = 0, stateEvalCount = 0;
  const expTaskSet = new Set();
  let midCount = 0, highCount = 0;

  data.taskTypes.forEach(t=>{
    const st = studentTaskState(s, t.id);
    stateCount += (st.count || 0);
    stateSilent += (st.silentCount || 0);
    stateEvalSum += (st.evalSum || 0);
    stateEvalCount += (st.evalCount || 0);
    if((st.count || 0) > 0 || st.rank === "中級" || st.rank === "上級") expTaskSet.add(t.id);
    if(st.rank === "中級" || st.rank === "上級") midCount += 1;
    if(st.rank === "上級") highCount += 1;
  });

  let recCount = 0, recSilent = 0, recEvalSum = 0, recEvalCount = 0, ontimeCount = 0, cleanupCount = 0;
  data.records.forEach(r=>{
    if(r.studentId === s.id && !r.isAdjustment && !r.isAbsent){
      recCount += 1;
      if(r.silence) recSilent += 1;
      if(typeof r.eval === "number"){ recEvalSum += r.eval; recEvalCount += 1; }
      if(r.ontime) ontimeCount += 1;
      if(r.cleanup) cleanupCount += 1;
      if(r.taskTypeId && data.taskTypes.some(t=>t.id===r.taskTypeId)) expTaskSet.add(r.taskTypeId);
    }
  });

  const totalCount = Math.max(stateCount, recCount);
  const totalSilent = Math.max(stateSilent, recSilent);
  const useRecEval = recEvalCount >= stateEvalCount;
  const totalEvalCount = useRecEval ? recEvalCount : stateEvalCount;
  const totalEvalSum = useRecEval ? recEvalSum : stateEvalSum;
  const experiencedTasks = expTaskSet.size;
  const overallAvg = totalEvalCount >= 5 ? (totalEvalSum / totalEvalCount) : 0;
  const allTasksCount = data.taskTypes.length;
  const badges = [];

  (data.badgeDefs || []).forEach(b=>{
    if(b.enabled === false) return;
    const target = Number(b.target) || 0;
    let unlocked = false;
    switch(b.type){
      case "totalCount": unlocked = totalCount >= target; break;
      case "silentCount": unlocked = totalSilent >= target; break;
      case "ontimeCount": unlocked = ontimeCount >= target; break;
      case "cleanupCount": unlocked = cleanupCount >= target; break;
      case "totalReward": unlocked = (s.totalReward || 0) >= target; break;
      case "avgEval": unlocked = totalEvalCount >= 5 && overallAvg >= target; break;
      case "reachMid": unlocked = midCount >= Math.max(1, target); break;
      case "reachHigh": unlocked = highCount >= Math.max(1, target); break;
      case "experiencedTasks": unlocked = experiencedTasks >= Math.max(1, target); break;
      case "allTasks": unlocked = allTasksCount > 0 && experiencedTasks >= allTasksCount; break;
    }
    badges.push({id:b.id, icon:b.icon||"🏅", title:b.title||"称号", desc:b.desc||"", unlocked});
  });

  if(data.autoMasterBadges !== false){
    data.taskTypes.forEach(t=>{
      const st = studentTaskState(s, t.id);
      if(st.rank === "上級"){
        badges.push({id:"master_"+t.id, icon:"🏆", title:`${t.name}極めし者`, desc:`${t.name}で最高ランク到達`, unlocked:true});
      }
    });
  }
  return badges;
}

function renderBadgesHtml(s, showLocked = true){
  if(data.features && data.features.badges === false) return "";
  const all = getBadgesForStudent(s);
  const list = showLocked ? all : all.filter(b=>b.unlocked);
  if(!list.length) return `<div class="empty">まだ獲得した称号はありません。</div>`;
  return `<div class="badge-grid">${list.map(b=>`
    <div class="badge-item ${b.unlocked?'':'locked'}">
      <span class="b-icon">${escapeHtml(b.icon)}</span>
      <div>
        <span class="b-title">${escapeHtml(b.title)}</span>
        <span class="b-desc">${escapeHtml(b.desc)}</span>
      </div>
    </div>`).join("")}</div>`;
}

function renderQuestBar(){
  if(data.features && data.features.quest === false) return "";
  const q = data.guildQuest || {title:"みんなで目指そう！", target:500, reward:"クラスお楽しみ会"};
  const total = data.students.reduce((sum, st)=>sum + (st.totalReward||0), 0);
  const target = Math.max(1, Number(q.target) || 500);
  const pct = Math.min(100, Math.round((total / target) * 100));
  const rewardPart = q.reward ? ` (ごほうび: ${escapeHtml(q.reward)})` : "";
  return `<div class="quest-bar">
    <div class="q-head">
      <div class="q-title">🏰 ギルドクエスト：${escapeHtml(q.title)}${rewardPart}</div>
      <div class="q-pts">${total} / ${target} ${escapeHtml(data.rewardUnit)} (${pct}%)</div>
    </div>
    <div class="quest-track"><div class="quest-fill" style="width:${pct}%"></div></div>
  </div>`;
}

function getWeeklyStats(){
  const days = Math.max(1, Number(data.mvpDays) || 7);
  const cutoffDate = new Date();
  cutoffDate.setDate(cutoffDate.getDate() - (days - 1));
  const y = cutoffDate.getFullYear();
  const m = String(cutoffDate.getMonth() + 1).padStart(2, "0");
  const d = String(cutoffDate.getDate()).padStart(2, "0");
  const cutoffStr = `${y}-${m}-${d}`;

  const stuMap = {};
  const partyMap = {};
  data.records.forEach(r=>{
    if(r.date >= cutoffStr && r.reward > 0){
      stuMap[r.studentId] = (stuMap[r.studentId] || 0) + r.reward;
      const st = data.students.find(x=>x.id===r.studentId);
      if(st && st.party && st.party !== "未所属"){
        partyMap[st.party] = (partyMap[st.party] || 0) + r.reward;
      }
    }
  });
  const topStudents = Object.entries(stuMap)
    .map(([sid, pts])=>({student: data.students.find(x=>x.id===sid), pts}))
    .filter(x=>x.student)
    .sort((a,b)=>b.pts - a.pts);
  const topParties = Object.entries(partyMap)
    .map(([party, pts])=>({party, pts}))
    .sort((a,b)=>b.pts - a.pts);
  return {days, topStudents, topParties};
}

function setStudentRank(studentId, taskId, newRank){
  const s = data.students.find(x=>x.id===studentId);
  if(!s) return;
  const st = ensureTaskState(s, taskId);
  if(st.rank===newRank) return;
  pushUndo(`${s.name}のランク変更`);
  st.rank = newRank; st.count=0; st.evalSum=0; st.evalCount=0; st.silentCount=0;
  save(); toast(`${s.name}さんのランクを${newRank}に変更しました`, true); render();
}

function applyAdjustment(studentId){
  const amtInput = document.getElementById(`adj-amt-${studentId}`);
  const noteInput = document.getElementById(`adj-note-${studentId}`);
  if(!amtInput) return;
  const amount = Math.round(parseFloat(amtInput.value));
  if(!amount){ toast("増減させる数値(整数)を入力してください"); return; }
  const s = data.students.find(x=>x.id===studentId);
  if(!s) return;
  pushUndo(`${s.name}のポイント調整`);
  s.totalReward = (s.totalReward||0) + amount;
  data.records.push({id:uid("r"), date:localTodayStr(), studentId, isAdjustment:true, reward:amount, note:noteInput ? noteInput.value.trim() : ""});
  save(); toast(`${amount>0?'+':''}${amount}${data.rewardUnit} 反映しました`, true);
  render();
}

function addStudent(){
  const inp = document.getElementById("new-student-name");
  const pinp = document.getElementById("new-student-party");
  if(!inp) return;
  const name = inp.value.trim();
  const party = (pinp && pinp.value.trim()) || "未所属";
  if(!name){ toast("名前を入力してください"); return; }
  pushUndo(`${name}の追加`);
  data.students.push({id:uid("s"), name, party, totalReward:0, taskState:{}, assigned:{}});
  save(); inp.value=""; if(pinp) pinp.value=""; render();
  toast(`${name}さんを追加しました`, true);
}

function removeStudent(id){
  const s = data.students.find(x=>x.id===id);
  showConfirm(`${s?s.name:"この生徒"}のデータを削除しますか？`, ()=>{
    pushUndo(`${s?s.name:"生徒"}の削除`);
    data.students = data.students.filter(st=>st.id!==id);
    data.records = data.records.filter(r=>r.studentId!==id);
    if(openStudentId===id) openStudentId=null;
    save(); render();
    toast("削除しました", true);
  });
}

function promote(studentId, taskId){
  const s = data.students.find(x=>x.id===studentId);
  if(!s) return;
  const st = ensureTaskState(s, taskId);
  const nr = nextRank(st.rank);
  if(!nr) return;
  pushUndo(`${s.name}の昇格`);
  st.rank = nr; st.count=0; st.evalSum=0; st.evalCount=0;
  save(); toast(`${s.name}さんが${nr}に昇格しました！`, true);
  fireConfetti();
  render();

  const s = data.students.find(x=>x.id===studentId);
  if(!s) return;
  ensureAssigned(s)[taskId] = checked;
  save();
  renderRecord();
  renderOverview();
}

function rotateAssignments(direction){
  const tIds = data.taskTypes.map(t=>t.id);
  if(tIds.length < 2){
    toast("掃除の種類が2つ以上あるときにローテーションできます");
    return;
  }
  const hasAny = data.students.some(s=>s.assigned && Object.values(s.assigned).some(Boolean));
  if(!hasAny){
    toast("現在チェックされている担当がないため、ローテーションできません");
    return;
  }
  pushUndo("当番ローテーション");
  data.students.forEach(s=>{
    const cur = s.assigned || {};
    const next = {};
    tIds.forEach((tid, idx)=>{
      if(cur[tid]){
        const newIdx = (idx + direction + tIds.length) % tIds.length;
        next[tIds[newIdx]] = true;
      }
    });
    s.assigned = next;
  });
  save();
  renderAssignments();
  renderRecord();
  renderOverview();
  toast(direction > 0 ? "🔄 全員の担当場所を1つ右(次)へずらしました！" : "🔄 全員の担当場所を1つ左(前)へ戻しました！", true);
}

function assignByPartyOrder(){
  const tIds = data.taskTypes.map(t=>t.id);
  if(!tIds.length) return;
  const parties = [];
  data.students.forEach(s=>{
    const p = s.party || "未所属";
    if(p !== "未所属" && !parties.includes(p)) parties.push(p);
  });
  if(!parties.length){
    toast("先に生徒に「1班」「2班」などの班を設定してください");
    return;
  }
  pushUndo("班順の自動割当");
  parties.sort((a,b)=>a.localeCompare(b, "ja", {numeric:true}));
  data.students.forEach(s=>{
    const p = s.party || "未所属";
    const pIdx = parties.indexOf(p);
    if(pIdx !== -1){
      const tid = tIds[pIdx % tIds.length];
      s.assigned = {[tid]: true};
    }
  });
  save();
  renderAssignments();
  renderRecord();
  renderOverview();
  toast("✨ 班ごとに順番で掃除場所を割り振りました！", true);
}

  data.taskTypes.forEach(t=>{
    if(t.ranks["中級"]){ t.ranks["中級"].needCount = mc; t.ranks["中級"].needEval = me; }
    if(t.ranks["上級"]){ t.ranks["上級"].needCount = hc; t.ranks["上級"].needEval = he; }

  toast("すべての掃除種類の昇格条件を一括更新しました", true);

      if(s.assigned) delete s.assigned[id];
      if(s.taskState) delete s.taskState[id];
    });
    save(); render();
    toast("掃除の種類を削除しました", true);
  });
}

const EVAL_LABEL = {5:"とても丁寧",4:"丁寧",3:"ふつう",2:"やや雑",1:"雑"};
let recordSession = {taskId:null, date:localTodayStr()};
let rowExpandState = {};
let customDraft = {};
let adjustExpandState = {};
let todaySummaryOpen = false;

const PRESETS = {
  great:{eval:5,silence:true,ontime:true,cleanup:true},
  good:{eval:4,silence:true,ontime:true,cleanup:true}
};

function findTodayRecord(sid, tid, date){
  for(let i=data.records.length-1;i>=0;i--){
    const r = data.records[i];
    if(!r.isAdjustment && r.studentId===sid && r.taskTypeId===tid && r.date===date) return r;
  }
  return null;
}
function promotionInfo(student, taskId){
  const st = studentTaskState(student, taskId);
  const nr = nextRank(st.rank);
  if(!nr) return null;
  const t = data.taskTypes.find(x=>x.id===taskId);
  if(!t || !t.ranks[nr]) return null;
  const need = t.ranks[nr];
  return {nr, ready: st.count>=need.needCount && avgEval(st)>=need.needEval};
}
function multiplierForEval(evalScore){
  const m = data.evalMultipliers || {great:1.2, good:1.0, needsWork:0.6};
  if(evalScore>=5) return m.great;
  if(evalScore>=4) return m.good;
  return m.needsWork;
}
function rewardForRankAndEval(rk, evalScore){
  return Math.max(0, Math.round(rk.reward * multiplierForEval(evalScore)));
}

function markAbsent(sid, tid){
  const date = recordSession.date;
  if(findTodayRecord(sid, tid, date)) return;
  const s = data.students.find(x=>x.id===sid);
  const t = data.taskTypes.find(x=>x.id===tid);
  if(!s || !t) return;
  pushUndo(`${s.name}のおやすみ登録`);
  data.records.push({id:uid("r"), date, studentId:sid, taskTypeId:tid, isAbsent:true, reward:0});
  save();
  delete customDraft[sid+"_"+tid];
  rowExpandState[sid+"_"+tid] = false;
  renderRecord();
  toast(`${s.name}さんを「おやすみ」にしました`, true);
}

function quickRecord(sid, tid, preset){
  const date = recordSession.date;
  if(findTodayRecord(sid, tid, date)) return;
  const s = data.students.find(x=>x.id===sid);
  const t = data.taskTypes.find(x=>x.id===tid);
  if(!s || !t) return;
  pushUndo(`${s.name}の記録`);
  const st = ensureTaskState(s, tid);
  const rk = t.ranks[st.rank] || t.ranks["初級"];
  const reward = rewardForRankAndEval(rk, preset.eval);
  st.count += 1; st.evalSum += preset.eval; st.evalCount += 1;
  if(preset.silence) st.silentCount = (st.silentCount||0)+1;
  s.totalReward = (s.totalReward||0) + reward;
  data.records.push({id:uid("r"), date, studentId:sid, taskTypeId:tid, rank:st.rank,
    eval:preset.eval, silence:preset.silence, ontime:preset.ontime, cleanup:preset.cleanup, reward});
  save();
  delete customDraft[sid+"_"+tid];
  rowExpandState[sid+"_"+tid] = false;
  renderRecord();
  toast(`${s.name}さん +${reward}${data.rewardUnit}`, true);
}

function quickParty(tid, partyName, presetKey){
  const preset = PRESETS[presetKey] || PRESETS.great;
  const list = data.students.filter(s => (s.party || "未所属") === partyName && (s.assigned && s.assigned[tid]));
  const date = recordSession.date;
  const t = data.taskTypes.find(x=>x.id===tid);
  if(!t) return;
  const targets = list.filter(s => !findTodayRecord(s.id, tid, date));
  if(!targets.length){
    toast(`${partyName}はすでに全員記録済みです`);
    return;
  }
  pushUndo(`${partyName}まとめて記録`);
  targets.forEach(s => {
    const st = ensureTaskState(s, tid);
    const rk = t.ranks[st.rank] || t.ranks["初級"];
    const reward = rewardForRankAndEval(rk, preset.eval);
    st.count += 1; st.evalSum += preset.eval; st.evalCount += 1;
    if(preset.silence) st.silentCount = (st.silentCount||0)+1;
    s.totalReward = (s.totalReward||0) + reward;
    data.records.push({id:uid("r"), date, studentId:s.id, taskTypeId:tid, rank:st.rank, eval:preset.eval, silence:preset.silence, ontime:preset.ontime, cleanup:preset.cleanup, reward});
    delete customDraft[s.id+"_"+tid];
    rowExpandState[s.id+"_"+tid] = false;
  });
  save();
  renderRecord();
  toast(`${partyName}の${targets.length}人をまとめて記録しました！`, true);
  if(presetKey === "great") fireConfetti();
}

function quickAllUnrecorded(presetKey){
  const preset = PRESETS[presetKey] || PRESETS.great;
  const date = recordSession.date;
  let count = 0;
  const hasAssignment = data.taskTypes.some(t=> data.students.some(s=>s.assigned && s.assigned[t.id]));
  pushUndo("未記録全員まとめて記録");
  if(hasAssignment){
    data.taskTypes.forEach(t=>{
      const list = data.students.filter(s=>s.assigned && s.assigned[t.id]);
      list.forEach(s=>{
        if(!findTodayRecord(s.id, t.id, date)){
          const st = ensureTaskState(s, t.id);
          const rk = t.ranks[st.rank] || t.ranks["初級"];
          const reward = rewardForRankAndEval(rk, preset.eval);
          st.count += 1; st.evalSum += preset.eval; st.evalCount += 1;
          if(preset.silence) st.silentCount = (st.silentCount||0)+1;
          s.totalReward = (s.totalReward||0) + reward;
          data.records.push({id:uid("r"), date, studentId:s.id, taskTypeId:t.id, rank:st.rank, eval:preset.eval, silence:preset.silence, ontime:preset.ontime, cleanup:preset.cleanup, reward});
          count++;
        }
      });
    });
  } else {
    const tid = recordSession.taskId || (data.taskTypes[0] && data.taskTypes[0].id);
    const t = data.taskTypes.find(x=>x.id===tid);
    if(t){
      data.students.forEach(s=>{
        if(!findTodayRecord(s.id, t.id, date)){
          const st = ensureTaskState(s, t.id);
          const rk = t.ranks[st.rank] || t.ranks["初級"];
          const reward = rewardForRankAndEval(rk, preset.eval);
          st.count += 1; st.evalSum += preset.eval; st.evalCount += 1;
          if(preset.silence) st.silentCount = (st.silentCount||0)+1;
          s.totalReward = (s.totalReward||0) + reward;
          data.records.push({id:uid("r"), date, studentId:s.id, taskTypeId:t.id, rank:st.rank, eval:preset.eval, silence:preset.silence, ontime:preset.ontime, cleanup:preset.cleanup, reward});
          count++;
        }
      });
    }
  }
  if(!count){
    undoStack.pop();
    updateUndoButton();
    toast("すでに全員分の記録が完了しています！");
    return;
  }
  save();
  renderRecord();
  toast(`未記録の${count}件をまとめて記録しました！`, true);
  if(presetKey === "great") fireConfetti();
}

function deleteRecordById(id){
  const r = data.records.find(x=>x.id===id);
  if(!r) return;
  const s = data.students.find(x=>x.id===r.studentId);
  pushUndo(`${s?s.name:"記録"}の取消`);
  if(s && !r.isAbsent){
    s.totalReward = (s.totalReward||0) - r.reward;
    if(!r.isAdjustment && r.taskTypeId){
      const st = ensureTaskState(s, r.taskTypeId);
      st.count = Math.max(0, st.count-1);
      st.evalSum = Math.max(0, st.evalSum - r.eval);
      st.evalCount = Math.max(0, st.evalCount-1);
      if(r.silence) st.silentCount = Math.max(0,(st.silentCount||0)-1);
    }
  }
  data.records = data.records.filter(x=>x.id!==id);
  save();
  toast("記録を取り消しました", true);
}

    ${adjustOpen ? `<div class="row" style="flex-basis:100%;margin:6px 0 0;gap:6px;align-items:center">
      <button class="btn small ghost" data-action="adjust" data-sid="${s.id}" data-amt="-5">-5</button>
      <button class="btn small ghost" data-action="adjust" data-sid="${s.id}" data-amt="-1">-1</button>
      <button class="btn small ghost" data-action="adjust" data-sid="${s.id}" data-amt="1">+1</button>
      <button class="btn small ghost" data-action="adjust" data-sid="${s.id}" data-amt="5">+5</button>
      <span style="font-size:.72rem;color:var(--ink-soft)">現在の累計: ${s.totalReward||0}${escapeHtml(data.rewardUnit)}</span>
    </div>` : ''}
  </div>`;
}

function todaySummaryHtml(date){
  const todays = data.records.filter(r=>r.date===date).slice().reverse();
  if(!todays.length) return `<div class="empty">この日の記録はまだありません。</div>`;
  return todays.map(r=>{
    const s = data.students.find(x=>x.id===r.studentId);
    const t = r.taskTypeId ? data.taskTypes.find(x=>x.id===r.taskTypeId) : null;
    if(r.isAbsent){
      return `<div class="hist-item" style="display:flex;justify-content:space-between;align-items:center;gap:8px">
        <span><b>${escapeHtml(s?s.name:"?")}</b> — ${escapeHtml(t?t.name:"?")} (💤 おやすみ)</span>
        <button class="btn small ghost" data-action="delete-record" data-rid="${r.id}">取消</button>
      </div>`;
    }
    const label = r.isAdjustment ? `🔧 ポイント調整${r.note?'('+escapeHtml(r.note)+')':''}` : escapeHtml(t?t.name:"?");
    return `<div class="hist-item" style="display:flex;justify-content:space-between;align-items:center;gap:8px">
      <span><b>${escapeHtml(s?s.name:"?")}</b> — ${label} ${r.reward>=0?'+':''}${r.reward}${escapeHtml(data.rewardUnit)}</span>
      <button class="btn small ghost" data-action="delete-record" data-rid="${r.id}">取消</button>
    </div>`;
  }).join("");
}

function renderRecord(){
  const el = document.getElementById("panel-record");
  if(!el) return;
  if(!data.students.length || !data.taskTypes.length){
    el.innerHTML = `<div class="card"><div class="empty">先に「⚙ 年度設定」タブで生徒と掃除の種類を登録してください。</div></div>`;
    return;
  }
  const date = recordSession.date;
  const hasAssignment = data.taskTypes.some(t=> data.students.some(s=>s.assigned && s.assigned[t.id]));
  let bodyHtml = "";

  if(hasAssignment){
    bodyHtml = data.taskTypes.map(t=>{
      const list = data.students.filter(s=>s.assigned && s.assigned[t.id]);
      if(!list.length) return "";
      const byParty = {};
      list.forEach(s => {
        const p = s.party || "未所属";
        if(!byParty[p]) byParty[p] = [];
        byParty[p].push(s);
      });
      let partyHtml = "";
      for(const p in byParty){
        const members = byParty[p];
        const allDone = members.every(s => findTodayRecord(s.id, t.id, date));
        partyHtml += `
          <div style="border: 1px solid var(--line); border-radius: 8px; padding: 10px; margin-bottom: 10px; background: var(--surface);">
            <div class="row" style="justify-content: space-between; margin-bottom: 6px; border-bottom: 1px dashed var(--line); padding-bottom: 6px;">
              <h3 style="margin:0; font-size: 0.9rem; color: var(--primary);">🚩 ${escapeHtml(p)}</h3>
              ${(!allDone && p !== "未所属") ? `<div class="row" style="gap:6px">
                <button class="btn gold small" data-action="quick-party" data-tid="${t.id}" data-party="${escapeHtml(p)}" data-preset="great">✨班まとめて◎</button>
                <button class="btn small" data-action="quick-party" data-tid="${t.id}" data-party="${escapeHtml(p)}" data-preset="good">班まとめて○</button>
              </div>` : ''}
            </div>
            ${members.map(s => recordRowHtml(s, t.id, date)).join("")}
          </div>`;
      }
      return `<div class="card" style="background:var(--surface-2)">
        <h2 style="font-size:1.02rem; margin-bottom: 8px;">🧹 ${escapeHtml(t.name)}</h2>
        ${partyHtml}
      </div>`;
    }).join("");

    const unassignedStudents = data.students.filter(s => !data.taskTypes.some(t => s.assigned && s.assigned[t.id]));
    if(unassignedStudents.length > 0){
      if(!recordSession.taskId || !data.taskTypes.find(x=>x.id===recordSession.taskId)) recordSession.taskId = data.taskTypes[0].id;
      const fallbackTid = recordSession.taskId;
      bodyHtml += `<div class="card" style="border-style:dashed">
        <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:6px">
          <h2 style="font-size:.95rem;margin:0">⚠️ 担当が未設定の生徒 (${unassignedStudents.length}人)</h2>
          <div class="row" style="gap:6px">
            <label style="margin:0">記録する掃除:</label>
            <select data-action="select-task-fallback" style="padding:4px 8px;font-size:.82rem">
              ${data.taskTypes.map(t=>`<option value="${t.id}" ${t.id===fallbackTid?'selected':''}>${escapeHtml(t.name)}</option>`).join("")}
            </select>
          </div>
        </div>
        <p class="setup-hint" style="margin-bottom:8px">「⚙ 年度設定 ＞ 👥 名簿・担当」で担当場所にチェックを入れると、上の各掃除カードに自動で振り分けられます。</p>
        <div>${unassignedStudents.map(s=>recordRowHtml(s, fallbackTid, date)).join("")}</div>
      </div>`;
    }
  } else {
    if(!recordSession.taskId || !data.taskTypes.find(x=>x.id===recordSession.taskId)) recordSession.taskId = data.taskTypes[0].id;
    const taskId = recordSession.taskId;
    bodyHtml = `<div class="card">
      <div><label>掃除の種類</label><select data-action="select-task-fallback">
        ${data.taskTypes.map(t=>`<option value="${t.id}" ${t.id===taskId?'selected':''}>${escapeHtml(t.name)}</option>`).join("")}
      </select></div>
      <p class="setup-hint">「⚙ 年度設定」の担当編成で担当を割り振ると、全種類が班ごとに一覧で並びます。</p>
      <div style="margin-top:8px">${data.students.map(s=>recordRowHtml(s, taskId, date)).join("")}</div>
    </div>`;
  }

  const todaysCount = data.records.filter(r=>r.date===date).length;
  let totalExpected = 0, doneExpected = 0;
  if(hasAssignment){
    data.taskTypes.forEach(t=>{
      data.students.filter(s=>s.assigned && s.assigned[t.id]).forEach(s=>{
        totalExpected++;
        if(findTodayRecord(s.id, t.id, date)) doneExpected++;
      });
    });
  } else {
    const tid = recordSession.taskId || (data.taskTypes[0] && data.taskTypes[0].id);
    totalExpected = data.students.length;
    data.students.forEach(s=>{ if(findTodayRecord(s.id, tid, date)) doneExpected++; });
  }
  const remainCount = Math.max(0, totalExpected - doneExpected);

  el.innerHTML = `
    <div class="card">
      <div class="row" style="justify-content:space-between;align-items:center">
        <div>
          <h2 style="margin:0">今日の記録 <span class="chip ${remainCount===0?'ok':''}">${remainCount===0 ? '🎉 全員記録完了！' : `残り ${remainCount}件 / 全${totalExpected}件`}</span></h2>
          <div class="sub" style="margin:2px 0 0">ボタンを押すだけで記録できます。間違えても右上の「↩️ 戻す」でいつでも取り消せます。</div>
        </div>
        <div class="row" style="gap:6px;align-items:flex-end">
          ${remainCount > 0 ? `
            <button class="btn gold small" data-action="quick-all" data-preset="great" title="まだ記録していない全員を◎で記録">⚡ 残り全員◎</button>
            <button class="btn small" data-action="quick-all" data-preset="good" title="まだ記録していない全員を○で記録">残り全員○</button>
          ` : ''}
          <div><label>記録する日付</label><input type="date" value="${date}" data-action="set-date"></div>
        </div>
      </div>
      <div class="row" style="justify-content:space-between;cursor:pointer;margin-top:10px;padding-top:8px;border-top:1px dashed var(--line)" data-action="toggle-today-summary">
        <h3 style="margin:0;font-size:.85rem">📝 この日の記録一覧 (${todaysCount}件・個別取消) ${todaySummaryOpen?'▲閉じる':'▼開く'}</h3>
      </div>
      ${todaySummaryOpen ? `<div id="today-summary" style="max-height:220px;overflow-y:auto;margin-top:6px">${todaySummaryHtml(date)}</div>` : ''}
    </div>
    ${bodyHtml}`;
}

function reportHandlerError(where, err){
  console.error(where + " failed:", err);
  const badge = document.getElementById("debug-badge");
  if(badge){
    badge.style.display = "block";
    badge.textContent = `エラー(${where}): ${err && err.message ? err.message : err}`;
  }
  toast(`エラーが発生しました(${where})`);
}

document.addEventListener("click", function(e){
  const btn = e.target.closest("[data-action]");
  if(!btn) return;
  const action = btn.dataset.action, sid = btn.dataset.sid, tid = btn.dataset.tid;
  try{
    if(action==="undo") performUndo();
    else if(action==="quick") quickRecord(sid, tid, PRESETS[btn.dataset.preset]);
    else if(action==="absent") markAbsent(sid, tid);
    else if(action==="quick-party") quickParty(tid, btn.dataset.party, btn.dataset.preset);
    else if(action==="quick-all") quickAllUnrecorded(btn.dataset.preset);
    else if(action==="detail") toggleRowExpand(sid, tid);
    else if(action==="submit-custom") submitCustom(sid, tid);
    else if(action==="delete-record"){ deleteRecordById(btn.dataset.rid); renderRecord(); }
    else if(action==="promote") promoteFromRecord(sid, tid);
    else if(action==="toggle-adjust"){ const k = sid+"_"+tid; adjustExpandState[k] = !adjustExpandState[k]; renderRecord(); }
    else if(action==="adjust") quickAdjust(sid, parseFloat(btn.dataset.amt));
    else if(action==="add-student") addStudent();
    else if(action==="bulk-add") bulkAddStudents(false);
    else if(action==="bulk-replace") bulkAddStudents(true);
    else if(action==="clear-all-students") clearAllStudents();
    else if(action==="remove-student") removeStudent(sid);
    else if(action==="open-student-detail-setup"){ openStudentId = (openStudentId===sid ? null : sid); renderStudents(); }
    else if(action==="toggle-overview-student"){ openStudentId = (openStudentId===sid ? null : sid); renderOverview(); }
    else if(action==="close-student-detail"){ openStudentId = null; render(); }
    else if(action==="apply-adjustment") applyAdjustment(sid);
    else if(action==="save-unit") saveUnit();
    else if(action==="export-backup") exportBackup();
    else if(action==="add-task") addTaskType();
    else if(action==="reset-all") resetAll();
    else if(action==="reset-records-only") resetRecordsOnly();
    else if(action==="remove-task") removeTask(tid);
    else if(action==="rotate-assign") rotateAssignments(parseInt(btn.dataset.dir, 10));
    else if(action==="assign-by-party") assignByPartyOrder();
    else if(action==="apply-bulk-thresholds") applyBulkThresholds();
    else if(action==="add-badge") addBadgeDef();
    else if(action==="remove-badge") removeBadgeDef(btn.dataset.bid);
    else if(action==="reset-badges-default") resetBadgesDefault();
    else if(action==="setup-subtab") showSetupSubtab(btn.dataset.sub);
    else if(action==="confirm-ok"){ const cb = pendingConfirmCallback; hideConfirm(); if(cb) cb(); }
    else if(action==="confirm-cancel") hideConfirm();
    else if(action==="toggle-today-summary"){ todaySummaryOpen = !todaySummaryOpen; renderRecord(); }
    else if(action==="save-pin") savePin();
    else if(action==="switch-student-mode") switchToStudentModeManually();
    else if(action==="pick-student") pickStudent(sid);
    else if(action==="unpick-student") unpickStudent();
    else if(action==="show-pin"){
      const box = document.getElementById("pin-box");
      if(box){
        box.style.display = "block";
        const inp = document.getElementById("pin-input");
        if(inp) inp.focus();
      }
    }
    else if(action==="submit-pin") submitTeacherPin();
  }catch(err){ reportHandlerError("click:"+action, err); }
});

document.addEventListener("change", function(e){
  const el = e.target.closest("[data-action]");
  if(!el) return;
  const action = el.dataset.action, sid = el.dataset.sid, tid = el.dataset.tid;
  try{
    if(action==="set-eval") setCustomEvalField(sid, tid, "eval", parseInt(el.value,10));
    else if(action==="set-silence") setCustomEvalField(sid, tid, "silence", el.checked);
    else if(action==="set-ontime") setCustomEvalField(sid, tid, "ontime", el.checked);
    else if(action==="set-cleanup") setCustomEvalField(sid, tid, "cleanup", el.checked);
    else if(action==="set-rank") setStudentRank(sid, tid, el.value);
    else if(action==="rename-student"){
      const s = data.students.find(x=>x.id===sid);
      if(s && el.value.trim()){
        pushUndo("名前の変更");
        s.name = el.value.trim();
        save(); render();
        toast("名前を更新しました", true);
      }
    }
    else if(action==="update-party"){
      const s = data.students.find(x=>x.id===sid);
      if(s){
        pushUndo("班の変更");
        s.party = el.value.trim() || "未所属";
        save(); render();
        toast(`${s.name}さんの班を「${s.party}」に保存しました`, true);
      }
    }
    else if(action==="rename-task") renameTask(tid, el.value);
    else if(action==="update-rank") updateRank(tid, el.dataset.rank, el.dataset.field, el.value);
    else if(action==="toggle-assign") toggleAssign(sid, tid, el.checked);
    else if(action==="import-backup") importBackupFile(el.files[0]);
    else if(action==="select-task-fallback") selectTaskFallback(el.value);
    else if(action==="set-date") setRecordDate(el.value);
    else if(action==="update-mult") updateMultiplier(el.dataset.tier, el.value);
    else if(action==="update-quest") updateQuestField(el.dataset.field, el.value);
    else if(action==="update-mvp-days"){
      data.mvpDays = Math.max(1, Math.round(parseFloat(el.value)||7));
      save(); renderDashboard();
      toast(`週間MVPの集計期間を${data.mvpDays}日間に設定しました`);
    }
    else if(action==="toggle-auto-master"){
      data.autoMasterBadges = el.checked;
      save(); toast("設定を保存しました");
    }
    else if(action==="toggle-feature"){
      toggleFeature(el.dataset.feat, el.checked);
    }
    else if(action==="update-badge"){
      const field = el.dataset.field;
      const val = (el.type === "checkbox") ? el.checked : el.value;
      updateBadgeDef(el.dataset.bid, field, val);
    }
  }catch(err){ reportHandlerError("change:"+action, err); }
});

document.addEventListener("keydown", function(e){
  if(e.key !== "Enter") return;
  const t = e.target;
  if(!t) return;
  if(t.id === "pin-input"){ e.preventDefault(); submitTeacherPin(); }
  else if(t.id === "new-student-name" || t.id === "new-student-party"){ e.preventDefault(); addStudent(); }
  else if(t.id === "new-task-name"){ e.preventDefault(); addTaskType(); }
});

function render(){
  updateUndoButton();
  if(viewMode === "student"){
    try{ renderStudentApp(); }
    catch(e){
      console.error("renderStudentApp failed:", e);
      const el = document.getElementById("student-app");
      if(el) el.innerHTML = `<div class="card"><b style="color:var(--danger)">⚠️ 表示エラー</b><div>${escapeHtml(String(e))}</div></div>`;
    }
    return;
  }
  const jobs = [
    ["panel-dashboard", renderDashboard],
    ["panel-overview", renderOverview],
    ["setup-students", renderStudents],
    ["setup-assign", renderAssignments],
    ["setup-tasks", renderSettings],
    ["setup-badges", renderBadgesSetup],
    ["setup-system", renderSystemSetup],
    ["panel-record", renderRecord]
  ];
  jobs.forEach(([elId, fn])=>{
    try{ fn(); }
    catch(e){
      console.error(elId + " render failed:", e);
      const el = document.getElementById(elId);
      if(el) el.innerHTML = `<div class="card"><b style="color:var(--danger)">⚠️ 表示エラー (${elId})</b><div>${escapeHtml(String(e))}</div></div>`;
    }
  });
  showSetupSubtab(activeSetupSubtab);
}

applyViewMode();
let restoredTab = "record";
try{ restoredTab = sessionStorage.getItem("soji-active-tab") || "record"; }catch(e){}
if(!TABS.some(t=>t.id===restoredTab)) restoredTab = "record";
showTab(restoredTab);
initArtifactSync();
</script>
</body>
</html>
